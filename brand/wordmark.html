<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thai GL Weekly — wordmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
  :root {
    --gold: #d4a15a;
    --paper: #efe9f6;
    --muted: #9184ad;
    --violet: #1a0a2e;
    --font-display: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
  }
  body { margin: 0; min-height: 100vh; background: var(--violet); color: var(--paper); font-family: var(--font-display); padding: 48px 24px; }
  .note { color: var(--muted); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 28px; }
  .tgw-wordmark { display: inline-flex; flex-direction: column; gap: .3em; line-height: 1; font-size: 3.1rem; align-items: center; }
  .tgw-wordmark .r1 { display: flex; align-items: baseline; gap: .4em; white-space: nowrap; font-weight: 700; letter-spacing: -.02em; }
  .tgw-wordmark .r1 .a { color: var(--paper); }
  .tgw-wordmark .r1 .b { color: var(--gold); }
  .tgw-wordmark .bar { height: 2px; background: var(--gold); width: 100%; }
  .tgw-wordmark .r2 { font-weight: 500; font-size: .42em; letter-spacing: .44em; text-transform: uppercase; color: var(--muted); align-self: stretch; text-align: center; }
  .spec { margin-top: 36px; max-width: 36rem; color: var(--muted); font-size: 14px; line-height: 1.6; }
  code { color: var(--gold); }
</style>
</head>
<body>
<p class="note">Do not redraw. This is the wordmark.</p>
<span class="tgw-wordmark">
  <span class="r1"><span class="a">THAI</span><span class="b">GL</span></span>
  <span class="bar"></span>
  <span class="r2">Weekly</span>
</span>
<div class="spec">
  <p>THAI in paper <code>#efe9f6</code>. GL in gold <code>#d4a15a</code>. A gold rule. Weekly in muted <code>#9184ad</code>, letter-spaced. Violet field <code>#1a0a2e</code>.</p>
  <p>A rule, not an emblem. Do not replace this with a logo mark, a gradient fill, or a redrawn lockup.</p>
</div>
</body>
</html>
