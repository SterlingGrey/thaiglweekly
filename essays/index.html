<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Essays · Thai GL Weekly</title>
  <meta name="description" content="Essays by Sterling Grey on Thai GL performances, stories and the work that stays with us.">
  <link rel="canonical" href="https://thaiglweekly.com/essays/">
  <meta name="theme-color" content="#0f0f14">
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      background: #0f0f14;
      color: #e8e8f0;
      font-family: "IBM Plex Sans Thai", "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
      line-height: 1.6;
    }
    header {
      background: #0a0a10;
      border-bottom: 1px solid #2a2a35;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      color: inherit;
    }
    .brand img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
    }
    .brand-text .top {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #efe9f6;
    }
    .brand-text .top span {
      color: #d4a15a;
    }
    .brand-text .weekly {
      font-size: 11px;
      letter-spacing: 0.28em;
      color: #9184ad;
      text-transform: uppercase;
    }
    nav {
      display: flex;
      gap: 22px;
      font-size: 15px;
    }
    nav a {
      color: #efe9f6;
      text-decoration: none;
    }
    nav a:hover {
      color: #d4a15a;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }
    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #d4a15a;
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(36px, 6vw, 52px);
      font-weight: 500;
      line-height: 1.1;
      margin: 0 0 12px;
    }
    .intro {
      color: #b8b4c8;
      font-size: 18px;
      margin-bottom: 40px;
    }
    .essay-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .essay-card {
      display: block;
      background: #16161e;
      border: 1px solid #2a2a35;
      border-radius: 12px;
      padding: 24px 28px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease;
    }
    .essay-card:hover {
      border-color: #d4a15a;
    }
    .essay-card h2 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 8px;
      color: #efe9f6;
    }
    .essay-card p {
      margin: 0 0 12px;
      color: #b8b4c8;
      font-size: 16px;
    }
    .essay-card .date {
      font-size: 13px;
      color: #9184ad;
      letter-spacing: 0.02em;
    }
    footer {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px 48px;
      text-align: center;
      font-size: 13px;
      color: #b8b4c8;
    }
    footer a {
      color: #b8b4c8;
      text-decoration: none;
    }
    footer a:hover {
      color: #d4a15a;
    }
    a:focus-visible { outline: 3px solid #d4a15a; outline-offset: 5px; }
    nav { flex-wrap: wrap; }
    @media (prefers-reduced-motion: reduce) { .essay-card { transition: none; } }
    @media (max-width: 600px) {
      header { padding: 16px; }
      .brand img { width: 56px; height: 56px; }
      main { padding: 32px 16px 48px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">
      <img src="logo-tgw.png" width="72" height="72" alt="Thai GL Weekly logo">
      <div class="brand-text">
        <span class="top">THAI <span>GL</span> WEEKLY</span>
        <span class="weekly">Essays</span>
      </div>
    </a>
    <nav aria-label="Main navigation">
      <a href="/">Tracker</a>
      <a href="/essays/" aria-current="page">Essays</a>
      <a href="/subscribe.html">Monday email</a>
    </nav>
  </header>

  <main>
    <div class="eyebrow">Writing by Sterling Grey</div>
    <h1>Essays</h1>
    <p class="intro">Longer pieces between the Monday emails. Opinions marked as opinions. Sources where they matter.</p>

    <div class="essay-list">
      <a class="essay-card" href="when-the-love-is-real/">
        <h2>When the Love Is Real</h2>
        <p>Shelly, Pundao, and the room a real relationship needs.</p>
        <time class="date" datetime="2026-10-10">10 October 2026</time>
      </a>
    </div>
  </main>

  <footer>
    <a href="/">Back to the Tracker</a>
  </footer>
</body>
</html>
