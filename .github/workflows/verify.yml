name: Verify tracker
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan tracked source for credentials
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          premium_scan_dir=$(mktemp -d)
          git archive HEAD | tar -x -C "$premium_scan_dir"
          "$RUNNER_TEMP/gitleaks" dir "$premium_scan_dir" --config .gitleaks.toml --redact --no-banner
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test catalog and member release safeguards
        run: npm test
      - name: Build complete tracker preview
        run: npm run build
      - name: Validate dormant Worker bundle
        run: npm run check:premium-bundle
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Assemble the actual branch-based Pages output
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Reject paid offers and private material in Pages output
        run: node --input-type=module -e 'import {verifyDormantOutput} from "./scripts/premium-public-guard.mjs"; verifyDormantOutput("_site");'
