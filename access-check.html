<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Access check — Thai GL Weekly</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #1a0a2e; color: #efe9f6; }
    body { margin: 0; }
    header { padding: 1.2rem max(1rem, calc((100vw - 1000px)/2)); border-bottom: 1px solid #6b567b; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    a { color: #e5b975; }
    main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: clamp(1.7rem, 4vw, 2.6rem); }
    p { line-height: 1.6; }
    #sign-in { display: flex; justify-content: center; margin-top: 2rem; }
    #status { min-height: 1.6em; }
    #content { width: 100%; height: 75vh; min-height: 600px; border: 1px solid #6b567b; border-radius: 12px; background: #1a0a2e; }
    [hidden] { display: none !important; }
  </style>
  <script defer crossorigin="anonymous" src="https://clerk.thaiglweekly.com/npm/@clerk/ui@1/dist/ui.browser.js"></script>
  <script defer crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsudGhhaWdsd2Vla2x5LmNvbSQ" src="https://clerk.thaiglweekly.com/npm/@clerk/clerk-js@6/dist/clerk.browser.js"></script>
</head>
<body>
  <header><strong>Thai <span style="color:#d4a15a">GL</span> Weekly · Full Access</strong><a href="tracker.html">Free Tracker</a></header>
  <main>
    <h1>Reader access check</h1>
    <p>This page checks reader sign-in and subscription access. Signing in does not subscribe you or charge you. The factual Tracker remains free.</p>
    <div id="user-button" hidden></div>
    <div id="sign-in" hidden></div>
    <p id="status" role="status" aria-live="polite">Loading sign-in…</p>
    <button id="refresh" type="button" hidden>Refresh access</button>
    <iframe id="content" title="Expanded Tracker" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" hidden></iframe>
  </main>
  <script>
    const signIn = document.getElementById('sign-in');
    const userButton = document.getElementById('user-button');
    const status = document.getElementById('status');
    const content = document.getElementById('content');
    const refresh = document.getElementById('refresh');
    const sandbox = window.location.pathname.endsWith('/access-check.html') && new URLSearchParams(window.location.search).get('sandbox') === '1';
    const worker = 'https://thai-gl-weekly-premium.se-1a1.workers.dev/' + (sandbox ? 'tracker-test' : 'tracker');
    if (sandbox) document.querySelector('h1').textContent = 'Sandbox reader access check';
    let lastSession = null;
    let requestId = 0;
    let signInMounted = false;
    let userButtonMounted = false;
    async function update(session) {
      if (!session) {
        requestId++;
        lastSession = null;
        content.hidden = true;
        content.srcdoc = '';
        userButton.hidden = true;
        refresh.hidden = true;
        signIn.hidden = false;
        status.textContent = 'Sign in to check Full Access.';
        if (!signInMounted) {
          signInMounted = true;
          const returnUrl = window.location.origin + window.location.pathname + (sandbox ? '?sandbox=1' : '');
          Clerk.mountSignIn(signIn, { withSignUp: true, forceRedirectUrl: returnUrl, signUpForceRedirectUrl: returnUrl });
        }
        return;
      }
      signIn.hidden = true;
      if (signInMounted) { signInMounted = false; Clerk.unmountSignIn(signIn); }
      userButton.hidden = false;
      refresh.hidden = false;
      if (!userButtonMounted) { userButtonMounted = true; Clerk.mountUserButton(userButton); }
      if (lastSession === session.id) return;
      lastSession = session.id;
      const currentRequest = ++requestId;
      content.hidden = true;
      content.srcdoc = '';
      status.textContent = 'Checking your subscription…';
      try {
        const token = await session.getToken();
        if (!token) throw new Error('No session token');
        const response = await fetch(worker, { headers: { Authorization: `Bearer ${token}` }, cache: 'no-store' });
        if (currentRequest !== requestId || Clerk.session?.id !== session.id) return;
        if (response.status === 403) {
          status.textContent = sandbox ? 'No active sandbox subscription was found for this email. Sign in with the email used for the test checkout.' : 'No active Full Access subscription was found for this email. Use the email from checkout or contact hello@thaiglweekly.com.';
          content.hidden = true;
        } else if (!response.ok) {
          status.textContent = response.status === 401 ? 'Please sign in again.' : 'The expanded Tracker is temporarily unavailable. Please try again later.';
          content.hidden = true;
        } else {
          const html = await response.text();
          if (currentRequest !== requestId || Clerk.session?.id !== session.id) return;
          content.srcdoc = html;
          content.hidden = false;
          status.textContent = '';
        }
      } catch {
        if (currentRequest === requestId) {
          status.textContent = 'The expanded Tracker is temporarily unavailable. Please try again later.';
          content.hidden = true;
        }
      }
    }
    window.addEventListener('load', async () => {
      if (window.location.protocol === 'file:') {
        status.textContent = 'This is a local page preview. Reader sign-in will work after this page is published on thaiglweekly.com.';
        return;
      }
      try {
        await Clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });
        Clerk.addListener(({ session }) => { void update(session); });
        refresh.addEventListener('click', () => { lastSession = null; void update(Clerk.session); });
      } catch {
        status.textContent = 'Sign-in is temporarily unavailable. Please try again later.';
      }
    });
  </script>
</body>
</html>
